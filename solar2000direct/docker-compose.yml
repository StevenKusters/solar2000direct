services:
  solar2000direct:
    build: .
    image: solar2000direct:latest
    container_name: solar2000direct
    restart: unless-stopped
    env_file: .env
    ports:
      - "8480:8480"
    volumes:
      # History lives outside the container so it survives image rebuilds.
      - ./data:/data
    healthcheck:
      # Unhealthy means the data is stale, not merely that the process is alive: a
      # collector that has lost the bus but still serves its last reading is the
      # failure worth catching.
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8480/api/health', timeout=5).status==200 else 1)"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
